name: Manual Ubuntu Core gadget release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_releases:
    strategy:
      fail-fast: false
      matrix:
        base: [16, 18, 20, 22, 24, 26]
        include:
          # The i386 recipes of these series build the pc-i386-gadget
          # repository, so only amd64 is built from this one
          - base: 16
            architectures: amd64
          - base: 18
            architectures: amd64
          - base: 20
            architectures: amd64
          - base: 22
            architectures: amd64,arm64
          - base: 24
            architectures: amd64,arm64
          - base: 26
            architectures: amd64,arm64
    runs-on: ubuntu-latest
    environment: store
    steps:
      - name: Build and release ${{ matrix.base }} to edge channel
        env:
          LP_CREDENTIALS: ${{ secrets.LP_CREDENTIALS }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        uses: snapcore/system-snaps-cicd-tools/action-rebuild-gadget@main
        with:
          branch: ${{ matrix.base }}
          architectures: ${{ matrix.architectures }}
